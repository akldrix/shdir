<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', path='/chat.css') }}">
    <title>Shmsg</title>
  </head>
  <body>
    <button class="delete-chat-btn" 
            data-chat-id="{{ chat_id }}">Delete this chat</button>
    <div>
      <form method="post" id="message-form">
        <input type="hidden" id="edit-message-id" value="">
        <input type="hidden" id="edit-chat-id" value="">
        <label for="message-input" id="form-label">Input the message: </label>
        <input id="message-input" type="text" name="text" placeholder="Type your message here" required>
        <button type="submit" id="submit-btn">Send the message</button>
        <button type="button" id="cancel-btn" style="display: none;">Cancel</button>
      </form>
    </div>
    {% if messages %}
    <div class="message-list">
      {% for message in messages %}
      <div class="message-item">
        <p class="message-text">{{ message.text }}</p>

        <div class="message-actions">
          <button class="copy-btn" data-text="{{ message.text }}">
            Copy
          </button>

          <span class="copy-status"></span>

          <button
              class="update-btn"
              data-chat-id="{{ message.chat_id }}"
              data-message-id="{{ message.id }}"
              data-text="{{ message.text }}"
              >
              Update
          </button>

            <button
                class="delete-btn"
                data-chat-id="{{ message.chat_id }}"
                data-message-id="{{ message.id }}"
                >
                Delete
            </button>
        </div>
      </div>
      {% endfor %}
    </div>
    {% endif %}    <br>
    <a href="/chat">Get back to chat selection</a>
  </body>
</html>

<script>
  const msgForm = document.getElementById("message-form");
  const msgInput = document.getElementById("message-input");
  const submitBtn = document.getElementById("submit-btn");
  const cancelBtn = document.getElementById("cancel-btn");
  const formLabel = document.getElementById("form-label");

  const editMessageIdInput = document.getElementById("edit-message-id");
  const editChatIdInput = document.getElementById("edit-chat-id");

  function resetEditMode() {
    msgForm.reset();

    editMessageIdInput.value = "";
    editChatIdInput.value = "";

    formLabel.textContent = "Input the message: ";
    submitBtn.textContent = "Send the message";
    cancelBtn.style.display = "none";
  }

  msgForm.addEventListener("submit", async (event) => {
    const editMessageId = editMessageIdInput.value;
    const editChatId = editChatIdInput.value;

    if (!editMessageId) {
      return;
    }

    event.preventDefault();

    const formData = new FormData();
    formData.append("text", msgInput.value);

    submitBtn.disabled = true;

    try {
      const response = await fetch(
        `/chat/${encodeURIComponent(editChatId)}/messages/${encodeURIComponent(editMessageId)}`,
        {
          method: "PUT",
          body: formData
        }
      );

      if (!response.ok) {
        const error = await response.text();
        throw new Error(error || "Error while updating the message");
      }

      resetEditMode();
      window.location.reload();

    } catch (error) {
      console.error("Update error:", error);
      alert("Error while updating the message");
    } finally {
      submitBtn.disabled = false;
    }
  });

  cancelBtn.addEventListener("click", resetEditMode);

  document.querySelectorAll(".update-btn").forEach(button => {
    button.addEventListener("click", (event) => {
      const btn = event.currentTarget;

      msgInput.value = btn.dataset.text;
      editMessageIdInput.value = btn.dataset.messageId;
      editChatIdInput.value = btn.dataset.chatId;

      formLabel.textContent = "Edit the message: ";
      submitBtn.textContent = "Save changes";
      cancelBtn.style.display = "inline-block";

      msgInput.focus();
    });
  });

  document.querySelectorAll(".delete-btn").forEach(button => {
    button.addEventListener("click", async (event) => {
      const btn = event.currentTarget;

      const chatId = btn.dataset.chatId;
      const messageId = btn.dataset.messageId;

      if (!confirm("Are you sure you want to delete this message?")) {
        return;
      }

      try {
        const response = await fetch(
          `/chat/${encodeURIComponent(chatId)}/messages/${encodeURIComponent(messageId)}`,
          {
            method: "DELETE"
          }
        );

        if (response.ok) {
          window.location.reload();
        } else {
          alert("Error while deleting the message");
        }

      } catch (error) {
        console.error("Delete error:", error);
      }
    });
  });

  document.querySelectorAll(".copy-btn").forEach(button => {
  button.addEventListener("click", async (event) => {
    const btn = event.currentTarget;
    const messageItem = btn.closest(".message-item");
    const textToCopy = messageItem.querySelector(".message-text").textContent.trim();
    const statusSpan = messageItem.querySelector(".copy-status");

    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(textToCopy);
      } else {
        const textarea = document.createElement("textarea");
        textarea.value = textToCopy;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";

        document.body.appendChild(textarea);
        textarea.select();

        const success = document.execCommand("copy");
        textarea.remove();

        if (!success) {
          throw new Error("Copy failed");
        }
      }

      statusSpan.textContent = "Copied!";

      setTimeout(() => {
        statusSpan.textContent = "";
      }, 2000);

    } catch (error) {
      console.error("Copy error:", error);
      statusSpan.textContent = "Copy failed";
    }
  });
});
  document.querySelectorAll(".delete-chat-btn").forEach(button => {
    button.addEventListener("click", async (event) => {
      const btn = event.currentTarget;

      const chatId = btn.dataset.chatId;

      if (!confirm("Are you sure you want to delete this chat?")) {
        return;
      }

      try {
        const response = await fetch(
          `/chat/${encodeURIComponent(chatId)}`,
          {
            method: "DELETE"
          }
        );

        if (response.ok) {
          window.location.replace('/chat'); 
        } else {

          alert("Error while deleting the chat");
        }

      } catch (error) {
        console.error("Delete error:", error);
      }
    });
  });

</script>
